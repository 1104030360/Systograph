[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kai-mind"
version = "0.1.0"
description = "Local AI health doctor backend foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
  "jsonschema>=4,<5",
  "httpx>=0.27,<1",
  "pathspec>=1.1,<2",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
kai-mind = "kai_mind.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kai_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/rag_projects/"]
mypy_path = "src"
warn_unused_configs = true
