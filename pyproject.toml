[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "systograph"
version = "0.1.0"
description = "AI system release-readiness foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
  "jsonschema>=4,<5",
  "httpx>=0.27,<1",
  "packaging>=26,<27",
  "pathspec>=1.1,<2",
  "filelock>=3.20,<4",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.6,<1",
  "types-jsonschema>=4.26.0.20260518",
]

[project.scripts]
systograph = "systograph.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/systograph"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "cli: Typer CLI adapter and command integration tests",
  "contract: schema and compatibility contract tests",
  "e2e: complete user workflow tests across persisted boundaries",
  "integration: tests crossing multiple core providers or services",
  "smoke: package import and minimal availability tests",
  "unit: isolated domain and service behavior tests",
  "web: FastAPI route and middleware integration tests",
]

[tool.coverage.run]
branch = true
source = ["systograph"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/rag_projects/"]
mypy_path = "src"
warn_unused_configs = true
