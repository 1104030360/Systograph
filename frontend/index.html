<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Doctor — System Map Viewer</title>
    <!-- Brand mark favicon (see frontend/src/icons/BrandMark.tsx). Colors are the
         viewer design tokens (light --accent-strong / dark --accent), switched by
         the OS scheme since a favicon cannot read the app's CSS variables. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><style>path{stroke:%234d7c0f}circle{fill:%234d7c0f}@media(prefers-color-scheme:dark){path{stroke:%2384cc16}circle{fill:%2384cc16}}</style><path d='M7 16h18M16 7v18M9.5 9.5l13 13M22.5 9.5l-13 13' fill='none' stroke-width='2.2' stroke-linecap='round'/><circle cx='7' cy='16' r='3.5'/><circle cx='25' cy='16' r='3.5'/><circle cx='16' cy='7' r='3.5'/><circle cx='16' cy='25' r='3.5'/></svg>"
    />
    <script>
      // Apply the persisted/system theme before paint to avoid a flash.
      (function () {
        try {
          // Default theme is Light; only a previously persisted choice overrides it.
          var stored = localStorage.getItem("viewer-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
