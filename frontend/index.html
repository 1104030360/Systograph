<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Doctor — System Map Viewer</title>
    <!-- Exact multicolour favicon from DeepResearch/index.html. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23eef7ff'/><path d='M8 16h16M16 8v16M9.5 9.5l13 13M22.5 9.5l-13 13' stroke='%23256ee8' stroke-width='2.2' stroke-linecap='round'/><circle cx='8' cy='16' r='3' fill='%2322b35d'/><circle cx='24' cy='16' r='3' fill='%23ff9f1c'/><circle cx='16' cy='8' r='3' fill='%238a45d7'/><circle cx='16' cy='24' r='3' fill='%23256ee8'/></svg>"
    />
    <script>
      // Apply the persisted/system theme before paint to avoid a flash.
      (function () {
        try {
          // Default theme is Light; only a previously persisted choice overrides it.
          var stored = localStorage.getItem("viewer-theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
