name: KAI-Mind Issue
description: 使用 Objective、Origin Document、Goals、Deliverable 統一描述 issue
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        請用這份統一格式描述 issue。重點是先釐清最終目的、起源文件、具體目標與可交付成果。

  - type: textarea
    id: objective
    attributes:
      label: Objective (最終目的)
      description: 說明這個 issue 最終想解決什麼問題，或要釐清什麼方向。
      placeholder: 例如：釐清 KAI-Mind scanner 的初步需求規格，確保 release-readiness gate 的開發方向明確，避免後續開發過程中出現需求不一致或理解偏差。
    validations:
      required: true

  - type: textarea
    id: origin_document
    attributes:
      label: Origin Document (起源文件)
      description: 列出這個 issue 的來源文件、討論、設計稿、參考 repo 或相關 issue。
      value: |
        - 
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: Goals (具體目標)
      description: 寫出這個 issue 要達成的具體目標。
      value: |
        - 
        - 
        - 
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable (可交付成果)
      description: 寫出完成後應該交付的具體產物，例如 feature 檔、文件、測試、fixtures、CLI 行為或 JSON report contract。
      value: |
        - 
        - 
        - 
    validations:
      required: true
