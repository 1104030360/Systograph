# STANDING POLICY: this catalog is for DISAMBIGUATION-ONLY patterns
# going forward -- cases where package identity alone cannot decide:
#   - endpoint-based vendor attribution (the OpenAI base_url ladder:
#     local OpenAI-compatible runtime vs the external OpenAI service),
#   - usage-shape capabilities (route decorators, client-variant typing
#     such as chromadb http vs persistent clients).
# New vendor/service coverage belongs in the package identity layer
# (package_capability_rules.toml), keyed on the import module name and
# joined from AST external-import facts -- not as new regexes here.
# Existing rules stay: they either disambiguate or still carry
# call-site evidence the import layer cannot produce.

[[patterns]]
rule_id = "code_pattern_embedding_openai"
kind = "embedding"
languages = ["python"]
extensions = [".py"]
regex = "\\bOpenAIEmbeddings\\s*\\("
snippet_group = ""

[[patterns]]
rule_id = "code_pattern_embedding_openai_sdk_create"
kind = "embedding"
languages = ["python", "javascript", "typescript"]
extensions = [".py", ".js", ".jsx", ".mjs", ".cjs", ".ts", ".tsx"]
regex = "\\b(?:[A-Za-z_][A-Za-z0-9_]*\\.)?embeddings\\.create\\s*\\("
snippet_group = ""

[[patterns]]
rule_id = "code_pattern_embedding_ollama"
kind = "embedding"
languages = ["python"]
extensions = [".py"]
regex = "\\bollama\\.(?:embed|embeddings)\\s*\\("
