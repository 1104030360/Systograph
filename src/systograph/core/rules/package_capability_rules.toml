# --- Multi-provider LLM gateway ---------------------------------------
#
# LiteLLM proxies many vendors behind one call shape
# (litellm.completion(model="provider/model")), so the import proves an
# LLM answerer exists but NOT which vendor serves it: kind "llm" reaches
# the llm_answerer node without claiming an external provider.
# Source: https://docs.litellm.ai/docs/completion

[[packages]]
module = "litellm"
slot = "llm"
kind = "llm"
name = "LiteLLM"
provider = "litellm"

# --- Chunking ---------------------------------------------------------
