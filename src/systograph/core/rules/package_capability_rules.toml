# Package capability registry: import module name -> canonical component.
#
# This catalog is the PACKAGE IDENTITY layer of the three-tier detection
# contract:
#
#   1. Package identity layer (this file): deterministic vendor/service
#      detection joined from AST external-import facts
#      (rule_id ast_external_import). Keys are IMPORT MODULE PATHS as
#      they appear in code -- a top-level package name
#      ("qdrant_client", "PyPDF2") or a dotted submodule prefix
#      ("llama_index.core.memory") -- NOT the PyPI distribution name.
#      An import matches the LONGEST key that prefixes its dotted
#      module path on segment boundaries: "qdrant_client.http" matches
#      the top-level "qdrant_client" entry, and
#      "llama_index.core.memory.chat_memory_buffer" matches the
#      "llama_index.core.memory" entry. A framework's bare top-level
#      name (e.g. "llama_index") stays UNMAPPED unless the table
#      carries an explicit top-level entry: frameworks are mapped at
#      the submodule level, because mapping a whole framework to one
#      capability would fabricate meaning.
#   2. code_pattern layer (code_pattern_rules.toml): deterministic
#      DISAMBIGUATION only -- endpoint-based vendor attribution (the
#      OpenAI base_url ladder), usage-shape capabilities (route
#      decorators, client-variant typing). New vendor/service coverage
#      belongs here in the package identity layer, not there.
#   3. Capabilities with no deterministic signature (chunker,
#      prompt_builder, session_state and similar plain-code behaviors)
#      are deliberately NOT rule-detected. They flow through the
#      mapping_proposal_service LLM-proposal + human-confirmation path,
#      which never decides profile states or readiness by itself.
#
# Documented EXCLUSIONS (division-of-labor contract -- do not add):
#   - openai: endpoint disambiguation in code_pattern rules owns vendor
#     attribution; the import alone cannot distinguish a local
#     OpenAI-compatible runtime (e.g. Ollama behind base_url) from the
#     external OpenAI service.
#   - chromadb: the client-variant regexes own the http vs persistent
#     typing distinction; the bare import cannot pick the variant.
#   - general-purpose packages (torch, numpy, requests, ...): package
#     identity does not imply any single capability -- mapping them
#     would fabricate meaning.
#   - httpx / aiohttp / requests: plain HTTP clients. Vendor attribution
#     for raw HTTP integrations belongs to endpoint_capability_rules.toml
#     (host whitelist), never to the transport package.
#   - tiktoken: token counting serves BOTH chunk sizing and context
#     budgeting (private-gpt counts prompt tokens; graphrag sizes
#     chunks). One import cannot tell which, so mapping it to chunker
#     would fabricate a component.
#   - spacy: the same import serves sentence segmentation and NER; only
#     the pipeline call shape disambiguates, and that is not import
#     identity.
#   - networkx: general graph maths with no AI-system meaning on its
#     own. GraphRAG-style evidence comes from graspologic community
#     detection below, which has no non-graph use.
#   - llama_index.core.postprocessor (bare namespace): 16 exports, of
#     which only 3 are rerankers -- the rest are similarity filters,
#     recency sorters, PII scrubbers and text optimizers. The specific
#     reranker symbols are mapped individually below.
#     Source: https://github.com/run-llama/llama_index/blob/main/llama-index-core/llama_index/core/postprocessor/__init__.py
#
# Every entry must map to a template slot of rag-core-v1 (or a slot the
# detection service can materialize) and a canonical kind present in
# capability_type_node_map.toml so the component lights its 52-node
# reference map node automatically.

[[packages]]
module = "ollama"
slot = "llm"
kind = "local_llm_runtime"
name = "Ollama"
provider = "ollama"

[[packages]]
module = "qdrant_client"
slot = "vector_store"
kind = "vector_db"
name = "Qdrant"
provider = "qdrant"

[[packages]]
module = "PyPDF2"
slot = "document_loader"
kind = "document_loader"
name = "PyPDF2"
provider = "pypdf2"

[[packages]]
module = "pypdf"
slot = "document_loader"
kind = "document_loader"
name = "pypdf"
provider = "pypdf"

[[packages]]
module = "bs4"
slot = "parser"
kind = "parser"
name = "BeautifulSoup"
provider = "beautifulsoup4"

# --- LlamaIndex (run-llama/llama_index) ------------------------------
#
# Framework capabilities live in DOTTED SUBMODULE PATHS; bare
# "llama_index" is deliberately unmapped (see header). Module structure
# verified against the official repository docs via Context7
# (/run-llama/llama_index):
#   - https://github.com/run-llama/llama_index/blob/main/README.md
#     ("from llama_index.core.xxx import ..." for core submodules,
#      "from llama_index.xxx.yyy import ..." for vendor integrations)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/cookbooks/toolhouse_llamaindex.ipynb
#     (llama_index.core.agent, llama_index.core.memory,
#      llama_index.core.workflow)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/cookbooks/llama3_cookbook.ipynb
#     (llama_index.core.tools)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/node_postprocessor/PrevNextPostprocessorDemo.ipynb
#     (llama_index.core.postprocessor, llama_index.core.node_parser)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/vector_stores/QdrantIndexDemo.ipynb
#     (llama_index.vector_stores.qdrant)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/node_postprocessor/FileNodeProcessors.ipynb
#     (llama_index.readers.file)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/vector_stores/AstraDBIndexDemo.ipynb
#     (llama_index.embeddings.openai)
#   - https://github.com/run-llama/llama_index/blob/main/llama-index-integrations/callbacks/llama-index-callbacks-argilla/README.md
#     (llama_index.llms.openai)
#   - https://github.com/run-llama/llama_index/blob/main/docs/examples/cookbooks/airtrain.ipynb
#     (llama_index.readers.* vendor reader integrations)
#
# Vendor-bearing entries exist ONLY where the vendor is in the module
# path itself (llama_index.vector_stores.qdrant). Generic
# llama_index.llms / llama_index.embeddings prefixes are NOT mapped:
# the vendor is unknown at that level and mapping one would fabricate
# attribution. llama_index.vector_stores.chroma is also NOT mapped:
# the chromadb exclusion above owns the http-vs-persistent variant
# distinction, which the wrapper import cannot decide either.

[[packages]]
module = "llama_index.core.agent"
slot = "agent_loop"
kind = "agent_loop"
name = "LlamaIndex Agent"
provider = "llama_index"

[[packages]]
module = "llama_index.core.workflow"
slot = "orchestrator"
kind = "orchestrator"
name = "LlamaIndex Workflow"
provider = "llama_index"

