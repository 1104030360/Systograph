# --- Graph-based RAG --------------------------------------------------
#
# hierarchical_leiden is community detection over an entity graph -- it
# has no non-graph use, so unlike networkx it is honest evidence of a
# graph-based RAG subsystem.
# Sources: https://graspologic-org.github.io/graspologic/latest/reference/partition.html
#          https://github.com/microsoft/graspologic-native

[[packages]]
module = "graspologic.partition"
slot = "graph_index"
kind = "graph_rag_system"
name = "Leiden Community Detection"
provider = "graspologic"

[[packages]]
module = "graspologic_native"
slot = "graph_index"
kind = "graph_rag_system"
name = "Leiden Community Detection"
provider = "graspologic"
