# Endpoint capability registry: API host -> canonical component.
#
# The ENDPOINT IDENTITY layer, a sibling of the package identity layer
# (package_capability_rules.toml) and strictly separate from it:
#
#   - Package identity answers "which SDK is imported".
#   - This catalog answers "which vendor API does this system call"
#     when there is NO SDK at all -- the raw-HTTP integration style
#     (aiohttp/httpx/requests against a literal base URL) that leaves
#     no importable vendor name behind.
#
# Facts from this layer carry the DEDICATED fact kind "endpoint_vendor"
# and rule ids prefixed "endpoint_vendor_", so they can never collide
# with the code_pattern or package rule families in the component
# bridge. Existing rule ids, regexes and bridge rule sets are frozen.
#
# MATCHING CONTRACT
#   - host: an EXACT hostname match (case-insensitive). Never a
#     substring: "openai" alone would match unrelated hosts and could
#     not tell a self-hosted OpenAI-compatible runtime from the real
#     service.
#   - port: matches ANY host on that port, for local runtimes whose
#     port is the distinctive signal (Ollama's 11434 stays 11434 whether
#     it is reached at localhost, 127.0.0.1, host.docker.internal or the
#     compose service name "ollama").
#   - path_prefix (optional): when present the URL path must start with
#     it, and the LONGEST matching path_prefix wins over a bare-host
#     row. This is how one host splits into several capabilities
#     (api.openai.com/v1/embeddings is an embedder; everything else on
#     that host is the answerer).
#
# DELIBERATELY NOT LISTED
#   - Generic local ports (8000, 8080, 1234): vLLM, llama.cpp, LM Studio
#     and LocalAI default to the most common web-app ports in existence.
#     A URL on :8080 is far more likely to be the project's own service
#     than an inference runtime, so claiming one would fabricate a
#     component. An unknown host produces nothing, by design.
#   - Self-hosted OpenAI-compatible base URLs: they are not the OpenAI
#     service and must never be attributed to it.
schema_version = "endpoint-capability/v1"

# --- OpenAI ---------------------------------------------------------
# https://platform.openai.com/docs/api-reference/chat
# https://platform.openai.com/docs/api-reference/embeddings

[[endpoints]]
rule_id = "endpoint_vendor_openai_embedding"
host = "api.openai.com"
path_prefix = "/v1/embeddings"
slot = "embedding_model"
kind = "embedding_provider"
name = "OpenAI Embeddings"
provider = "openai"

[[endpoints]]
rule_id = "endpoint_vendor_openai_llm"
host = "api.openai.com"
slot = "llm"
kind = "external_llm_provider"
name = "OpenAI"
provider = "openai"

