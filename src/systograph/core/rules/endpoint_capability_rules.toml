# --- Local runtimes (port is the distinctive signal) ----------------
# https://github.com/ollama/ollama/blob/main/docs/api.md
# Ollama binds 11434 by default and keeps that port behind every host
# form: localhost, 127.0.0.1, host.docker.internal, or the compose
# service name.

[[endpoints]]
rule_id = "endpoint_vendor_ollama_runtime"
port = 11434
slot = "llm"
kind = "local_llm_runtime"
name = "Ollama"
provider = "ollama"
