# Canonical component type -> capability reference node ids.
#
# Single source of truth for the Step 6 reference capability
# assessment lookup. Every node id must exist in the 52-node
# capability reference catalog (capability_reference_map.toml).
# Duplicate keys are rejected by the TOML parser itself.
#
# ARRAY ORDER IS SEMANTIC: the first node decides the projection
# plane. A canonical type may reach several nodes, and those nodes may
# sit on different planes (api_input reaches user_input on the
# input/intent plane and api_server on the deployment/topology plane).
# CanonicalTypePlaneResolver reads element [0] as the primary node and
# projects the component onto that node's plane_id, so reordering a row
# moves components between bands in the viewer. Step 6 assessment still
# consumes the whole array -- order changes nothing there. Put the node
# that best describes where the component belongs on the map first.

[canonical_type_nodes]
agent_loop = ["agent_loop", "agent_runtime"]
api_input = ["user_input", "api_server"]
api_orchestrator = ["api_server"]
api_route = ["api_server"]
chunker = ["chunker"]
conflict_checker = ["conflict_checker"]
context_composer = ["context_composer"]
document_loader = ["document_loader"]
embedder = ["embedder"]
embedding_model = ["embedder"]
embedding_provider = ["embedder"]
external_llm = ["llm_answerer"]
external_llm_provider = ["llm_answerer"]
graph_rag_system = ["graph_rag_system"]
graph_retriever = ["graph_retriever"]
http_vector_store = ["index_builder"]
hybrid_retriever = ["hybrid_retriever"]
index_builder = ["index_builder"]
llm = ["llm_answerer"]
local_llm_runtime = ["llm_answerer"]
local_persistent_vector_store = ["index_builder"]
long_term_memory = ["long_term_memory"]
memory = ["long_term_memory"]
metadata_extractor = ["metadata_extractor"]
orchestrator = ["orchestrator"]
parser = ["parser"]
prompt_template = ["prompt_builder"]
query_classifier = ["query_classifier"]
rag_anything_system = ["rag_anything_system"]
reranker = ["reranker"]
reranker_candidate = ["reranker"]
retriever = ["dense_retriever"]
router = ["router"]
router_like_evidence = ["router"]
sparse_retriever = ["sparse_retriever"]
tool = ["tool_using_generator", "tool_network"]
vector_db = ["index_builder"]
vector_db_config = ["index_builder"]
vector_retriever = ["dense_retriever"]
vector_store = ["index_builder"]
worker_queue = ["worker_queue"]
workflow_node = ["orchestrator"]
working_memory = ["working_memory"]
